<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TWork — Фин-мониторинг (прототип)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="TWork — на главную">
      <svg class="brand__logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="7" fill="#fff"/>
        <path d="M8 18c0-3 2-5 5-5h1v11c-3.5 0-6-2.5-6-6z" fill="#ffdd2d"/>
        <rect x="16" y="6" width="8" height="18" rx="3" fill="#e9e9e9"/>
      </svg>
      <span class="brand__name">TWork</span>
    </a>

    <div class="user">
      <a class="user__info" href="#/statuses" title="Сменить статус">
        <div class="user__name">Алексей П.</div>
        <div class="user__status" id="user-status">Оффлайн</div>
      </a>
      <button class="user__power" id="user-power" type="button" data-action="toggle-power" aria-label="Выйти на линию">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M6.4 6.6a8 8 0 1 0 11.2 0" />
        </svg>
      </button>
    </div>
  </header>

  <nav class="subnav" aria-label="Навигация">
    <a class="subnav__item" id="nav-home" href="#/" aria-label="Главная">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
    </a>
    <ol class="crumbs" id="crumbs"></ol>
  </nav>

  <main class="page" id="app"></main>

  <footer class="proto-footer">
    Прототип · данные хранятся в этом браузере ·
    <button type="button" class="linklike" data-action="reset">Сбросить данные</button>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
